<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevStream — Create Account</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
          </svg>
        </div>
        <h1 class="auth-title">Join DevStream</h1>
        <p class="auth-sub">Create your free developer community account</p>
      </div>

      <div id="form-error" class="form-error mb-16 hidden"></div>

      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input class="form-input" type="text" id="name" placeholder="Alex Johnson" autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" placeholder="alex_dev" autocomplete="username" autocapitalize="none">
        <div class="form-hint">Letters, numbers, underscores only. Shown publicly.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="bio">Bio <span style="color:var(--text-3);font-weight:400">(optional)</span></label>
        <input class="form-input" type="text" id="bio" placeholder="Full-stack dev who loves building things 🚀" maxlength="200">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm">Confirm Password</label>
        <input class="form-input" type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password">
      </div>

      <button class="btn btn-primary w-full" id="register-btn" style="margin-top:8px">Create Account</button>

      <div class="auth-divider">Already have an account? <a href="/login.html" class="auth-link">Sign in</a></div>
    </div>
  </div>

  <script type="module">
    import { authAPI, showToast } from '/js/api.js';
    import { saveAuth, redirectIfAuth } from '/js/auth.js';

    redirectIfAuth();

    const nameEl     = document.getElementById('name');
    const usernameEl = document.getElementById('username');
    const bioEl      = document.getElementById('bio');
    const passwordEl = document.getElementById('password');
    const confirmEl  = document.getElementById('confirm');
    const regBtn     = document.getElementById('register-btn');
    const errorEl    = document.getElementById('form-error');

    function showError(msg, field) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
      if (field) {
        field.classList.add('error');
        field.focus();
      }
    }
    function clearErrors() {
      errorEl.classList.add('hidden');
      [nameEl, usernameEl, passwordEl, confirmEl].forEach((el) => el.classList.remove('error'));
    }

    async function handleRegister() {
      clearErrors();

      const name     = nameEl.value.trim();
      const username = usernameEl.value.trim();
      const bio      = bioEl.value.trim();
      const password = passwordEl.value;
      const confirm  = confirmEl.value;

      if (!name)     { showError('Please enter your full name.', nameEl); return; }
      if (!username) { showError('Please choose a username.', usernameEl); return; }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) { showError('Username: letters, numbers, underscores only.', usernameEl); return; }
      if (!password) { showError('Please enter a password.', passwordEl); return; }
      if (password.length < 6) { showError('Password must be at least 6 characters.', passwordEl); return; }
      if (password !== confirm) { showError('Passwords do not match.', confirmEl); return; }

      regBtn.disabled = true;
      regBtn.textContent = 'Creating account…';

      try {
        const { token, user } = await authAPI.register({ name, username, bio, password });
        saveAuth(token, user);
        showToast('Account created! Welcome, ' + user.name + ' 🎉', 'success');
        setTimeout(() => window.location.href = '/index.html', 800);
      } catch (err) {
        showError(err.message);
        regBtn.disabled = false;
        regBtn.textContent = 'Create Account';
      }
    }

    regBtn.addEventListener('click', handleRegister);
    confirmEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleRegister(); });
  </script>
</body>
</html>
